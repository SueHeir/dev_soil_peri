[package]
name = "peri_bond"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Bond-based peridynamics for dev_soil_peri: constant-micromodulus pairwise force, critical-stretch breakage, damage"
keywords = ["peridynamics", "bond-based", "fracture", "simulation"]
categories = ["simulation", "science"]

[dependencies]
soil_core = { git = "https://github.com/SueHeir/soil.git", branch = "main", default-features = false }
grass_app = { git = "https://github.com/SueHeir/grass.git", branch = "main" }
grass_scheduler = { git = "https://github.com/SueHeir/grass.git", branch = "main" }
peri_atom = { path = "../peri_atom", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }

[features]
default = []
mpi_backend = ["soil_core/mpi_backend", "peri_atom/mpi_backend"]
