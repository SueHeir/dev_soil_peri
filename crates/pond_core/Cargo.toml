[package]
name = "pond_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Peridynamics simulation framework with plugin architecture (POND umbrella crate)"
keywords = ["peridynamics", "nonlocal", "simulation", "fracture"]
categories = ["simulation", "science"]

[features]
default = ["mpi_backend"]
mpi_backend = ["soil_core/mpi_backend", "pond_atom/mpi_backend", "pond_bond/mpi_backend"]

[dependencies]
grass_scheduler = { git = "https://github.com/SueHeir/grass.git", branch = "main" }
grass_app = { git = "https://github.com/SueHeir/grass.git", branch = "main" }
grass_derive = { git = "https://github.com/SueHeir/grass.git", branch = "main" }
soil_core = { git = "https://github.com/SueHeir/soil.git", branch = "main", default-features = false }
soil_verlet = { git = "https://github.com/SueHeir/soil.git", branch = "main" }
soil_print = { git = "https://github.com/SueHeir/soil.git", branch = "main" }
soil_derive = { git = "https://github.com/SueHeir/soil.git", branch = "main" }
soil_deform = { git = "https://github.com/SueHeir/soil.git", branch = "main" }
soil_fixes = { git = "https://github.com/SueHeir/soil.git", branch = "main" }
pond_atom = { path = "../pond_atom", version = "0.1.0" }
pond_bond = { path = "../pond_bond", version = "0.1.0" }
