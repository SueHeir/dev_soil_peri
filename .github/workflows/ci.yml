name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: build + test + validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # peri_family_consistency builds with MPI and compares a 1-rank and a
      # 2-rank run; without an MPI library mpi-sys fails to build.
      - name: Install Open MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-targets --no-default-features

      - name: Test workspace
        run: cargo test --workspace --no-default-features

      - name: Run validation script
        env:
          BENCH_PYTHON: python3
        run: validation/run.sh
